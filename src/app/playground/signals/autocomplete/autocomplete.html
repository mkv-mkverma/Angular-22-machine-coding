<p>autocomplete works!</p>
<label for="autocomplete-search">Search products</label>
<input id="autocomplete-search" type="text" placeholder="search.." [formField]="searchForm" />

@if (isloading()) {
  <p>Loading...</p>
} @else {
  <ul>
    @for (product of products(); track product.id) {
      <li>{{ product.title }}</li>
    } @empty {
      <li>No Product</li>
    }
  </ul>
}
